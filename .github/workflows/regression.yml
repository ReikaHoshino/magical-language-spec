name: Repository regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate schemas and fixtures
        run: python tests/validate_schemas.py

      - name: Run repository regression tests
        run: python -m unittest discover -s tests -v

      - name: Check pull-request diff
        if: github.event_name == 'pull_request'
        run: >-
          git diff --check
          "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
